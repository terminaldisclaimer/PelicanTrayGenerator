[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traygen"
version = "0.1.0"
description = "Parametric PETG tray + TPU crush-rib insert generator for carrying fragile glass in a Pelican case."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "shapely>=2.0",
    "trimesh>=4.0",
    "manifold3d>=2.3",
    "matplotlib>=3.7",
    "svgpathtools>=1.6",
    "ezdxf>=1.1",
    "networkx>=3.0",
    "lxml>=4.9",
]

[project.scripts]
traygen = "traygen.cli:main"
traygen-stack = "traygen.stacking.cli:main"

[tool.setuptools]
packages = ["traygen", "traygen.stacking"]
