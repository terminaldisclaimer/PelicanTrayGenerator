name: Deploy to Cloudflare Workers

# Manual only: this repository self-hosts, so a Cloudflare deploy is something
# you ask for. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This repository's default branch is not called "main", so the branch is
    # resolved at run time rather than hard-coded.
    if: >
      github.ref_name == github.event.repository.default_branch ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # No BASE_PATH: the Worker serves the site from the domain root.
      - run: npm run build

      - name: Warn when Cloudflare is not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set - skipping the deploy."
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
