# Included by every location block. nginx drops inherited add_header
# directives as soon as a location declares one of its own, so these are
# included rather than set once at server level.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# The app makes no external requests at all: it loads its own bundle and WASM
# kernel and does everything else in memory, so everything is locked to 'self'.
#
# 'unsafe-eval' is required, not preferred: the geometry kernel's Emscripten
# loader evaluates a string at startup, and 'wasm-unsafe-eval' alone makes the
# app fail to start. The protection that actually matters here is still in
# place - connect-src 'self' means a compromised dependency has nowhere to
# send your part outlines, and object-src/base-uri/frame-ancestors are shut.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
